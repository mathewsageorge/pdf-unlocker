{% extends "base.html" %}

{% block title %}Unlock PDF{% endblock %}

{% block content %}
    <h1>Unlock PDF</h1>
    <form method="POST" enctype="multipart/form-data">
        <div class="form-group">
            <label for="pdf_file">Select PDF File:</label>
            <input type="file" id="pdf_file" name="pdf_file" accept=".pdf" required>
        </div>
        
        <div class="form-group">
            <label for="password">PDF Password:</label>
            <input type="text" id="password" name="password" placeholder="Enter the password..." required>
        </div>
        
        <button type="submit">Unlock and Download</button>
    </form>
{% endblock %}
