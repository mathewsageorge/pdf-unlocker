{% extends "base.html" %}

{% block title %}Convert Image Format{% endblock %}

{% block content %}
    <h1>Convert Image Format</h1>
    <form method="POST" enctype="multipart/form-data">
        <div class="form-group">
            <label for="image_file">Select Image File:</label>
            <input type="file" id="image_file" name="image_file" accept="image/*" required>
        </div>
        
        <div class="form-group">
            <label for="target_format">Convert To:</label>
            <select id="target_format" name="target_format" required>
                <option value="PNG">PNG</option>
                <option value="JPEG">JPG / JPEG</option>
                <option value="WEBP">WEBP</option>
                <option value="GIF">GIF</option>
                <option value="BMP">BMP</option>
            </select>
        </div>
        
        <button type="submit">Convert and Download</button>
    </form>
{% endblock %}
