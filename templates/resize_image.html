{% extends "base.html" %}

{% block title %}Resize Image{% endblock %}

{% block content %}
    <h1>Resize Image</h1>
    <form method="POST" enctype="multipart/form-data">
        <div class="form-group">
            <label for="image_file">Select Image File:</label>
            <input type="file" id="image_file" name="image_file" accept="image/*" required>
        </div>
        
        <div class="form-group" style="display: flex; gap: 1rem;">
            <div style="flex: 1;">
                <label for="width">New Width (px):</label>
                <input type="number" id="width" name="width" placeholder="e.g. 800" required>
            </div>
            <div style="flex: 1;">
                <label for="height">New Height (px):</label>
                <input type="number" id="height" name="height" placeholder="e.g. 600" required>
            </div>
        </div>
        
        <button type="submit">Resize and Download</button>
    </form>
{% endblock %}
